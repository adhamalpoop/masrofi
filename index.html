<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>مصروفي</title>
<style>
:root{
  --bg:#eef3f2;--card:#ffffff;--text:#13262b;--muted:#6b7c80;--line:#e3eaea;
  --brand:#0f766e;--brand2:#14a398;--in:#128a4b;--out:#d1433a;--warn:#fff4d6;--warnl:#f2c75c;--chip:#eaf2f1;
  --shadow:0 2px 10px rgba(15,60,60,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1819;--card:#16262a;--text:#e8f1f1;--muted:#93a6a9;--line:#24383c;--chip:#1f3337;--warn:#3a3217;--warnl:#7a6422;--shadow:0 2px 10px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:92px;font-size:15px;line-height:1.5}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px max(16px,calc((100% - 760px)/2 + 14px));display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top h1{margin:0;font-size:19px;font-weight:700;flex:1}
.top button{width:auto;margin:0;padding:6px 12px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px}
.page{display:none}.page.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.hero small{opacity:.85}
.hero .big{font-size:34px;font-weight:800;margin:2px 0 6px;letter-spacing:.3px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:16px}
.hero .stat{background:rgba(255,255,255,.16);box-shadow:none}.hero .stat small{color:#e6fffb}
label{display:block;margin:12px 0 6px;font-size:13px;color:var(--muted)}
input,select,textarea,button{font-family:inherit;font-size:16px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
button:active{transform:scale(.98)}
button.sec{background:var(--chip);color:var(--text)}
button.sm{width:auto;padding:6px 12px;margin:0;font-size:13px;border-radius:9px}
button.del{background:#fde8e6;color:#b42318}
.amount{font-size:34px;font-weight:800;text-align:center;border:0;background:transparent;padding:6px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{margin:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:11px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.k-expense{color:var(--out)}.seg button.on.k-income{color:var(--in)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:170px;overflow:auto;padding:2px}
.chip{width:auto;margin:0;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--text);font-weight:500;font-size:14px}
.chip.on{background:var(--brand);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.ic.out{background:#fde8e6;color:var(--out)}.ic.in{background:#def5e8;color:var(--in)}.ic.tr{background:#e4edfb;color:#2f5fb3}.ic.db{background:#fdf0d5;color:#a86a00}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}
.in-c{color:var(--in)}.out-c{color:var(--out)}
.wscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.wcard{flex:none;min-width:150px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.wcard small{color:var(--muted)}.wcard b{display:block;font-size:19px}
.due{background:var(--warn);border:1px solid var(--warnl)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:6px}
.bar.inb i{background:var(--in)}
.subrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:3px 14px 0 0}
.menu button{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--text);text-align:right;margin:0 0 10px;padding:16px;border-radius:16px;box-shadow:var(--shadow)}
.menu button span{flex:1}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:before{content:"＋ ";color:var(--brand2)}
.hide{display:none!important}
.empty{color:var(--muted);text-align:center;padding:18px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:760px;align-items:flex-end}
nav button{flex:1;margin:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav button.fab{margin-top:-22px}
nav button.fab span.c{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(15,118,110,.45)}
nav button.fab svg{stroke:#fff;width:28px;height:28px}
#msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1f2d30;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9;max-width:92%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
@media(min-width:900px){
  main{padding:22px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .home-grid .card{margin-bottom:0}
  .span2{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="top"><button id="backBtn" class="hide" data-go="more">رجوع</button><h1 id="title">مصروفي</h1></div>
<div id="msg"></div>
<main>

<section class="page on" id="p-home">
  <div id="dueBox"></div>
  <div class="card hero">
    <small>إجمالي الأرصدة</small>
    <div class="big" id="total">0</div>
    <small id="totalNote"></small>
    <div class="grid3" style="margin-top:10px">
      <div class="stat"><small>دخل الشهر</small><b id="hin">0</b></div>
      <div class="stat"><small>مصروف الشهر</small><b id="hout">0</b></div>
      <div class="stat"><small>الصافي</small><b id="hnet">0</b></div>
    </div>
  </div>
  <div class="home-grid">
    <div class="card span2"><h3>المحافظ</h3><div class="wscroll" id="hwallets"></div></div>
    <div class="card span2"><h3>آخر العمليات</h3><div id="hrecent"></div></div>
  </div>
</section>

<section class="page" id="p-add">
  <div class="card">
    <input id="amount" class="amount" type="number" inputmode="decimal" placeholder="0.00">
    <div class="seg" id="kindSeg">
      <button data-kind="expense" class="k-expense on">مصروف</button>
      <button data-kind="income" class="k-income">دخل</button>
      <button data-kind="debt" class="k-debt">دين</button>
    </div>
    <div id="debtBox" class="hide">
      <label>نوع الدين</label>
      <div class="chips" id="debtChips">
        <button class="chip on" data-dt="lent">سلفت حد</button>
        <button class="chip" data-dt="borrowed">استلفت من حد</button>
        <button class="chip" data-dt="repay_in">حد سددلي</button>
        <button class="chip" data-dt="repay_out">أنا سددت لحد</button>
      </div>
      <label>الشخص</label>
      <input id="person" placeholder="الاسم">
      <input id="phone" placeholder="الموبايل" inputmode="tel" style="margin-top:8px">
      <button class="sec" id="pick" type="button">اختار من جهات الاتصال</button>
    </div>
    <div id="catBox">
      <label>التصنيف</label>
      <div class="chips" id="mainChips"></div>
      <div id="subWrap" class="hide"><label>التصنيف الفرعي</label><div class="chips" id="subChips"></div></div>
    </div>
    <label>المحفظة</label>
    <select id="wallet"></select>
    <div class="two">
      <div><label>التاريخ</label><input id="date" type="date"></div>
      <div><label>الوقت</label><input id="time" type="time"></div>
    </div>
    <label>ملاحظة</label>
    <input id="note" placeholder="اختياري">
    <label>مرفق (صورة فاتورة أو PDF)</label>
    <input id="file" type="file" accept="image/*,application/pdf">
    <button id="save">حفظ</button>
  </div>
</section>

<section class="page" id="p-list">
  <div class="card">
    <div class="two">
      <div><label>الشهر</label><input id="lmonth" type="month"></div>
      <div><label>المحفظة</label><select id="lwallet"></select></div>
    </div>
    <label><input id="lall" type="checkbox" style="width:auto;margin-left:8px"> كل الفترة</label>
    <input id="lsearch" placeholder="بحث في الملاحظات والتصنيف والأسماء">
  </div>
  <div class="card" id="list"></div>
</section>

<section class="page" id="p-report">
  <div class="card"><label style="margin-top:0">الشهر</label><input id="month" type="month"></div>
  <div class="grid3" style="margin-bottom:14px">
    <div class="stat"><small>الدخل</small><b class="in-c" id="rin">0</b></div>
    <div class="stat"><small>المصروف</small><b class="out-c" id="rout">0</b></div>
    <div class="stat"><small>الصافي</small><b id="rnet">0</b></div>
  </div>
  <div class="card"><h3>المصروف حسب التصنيف</h3><div id="repExp"></div></div>
  <div class="card"><h3>الدخل حسب التصنيف</h3><div id="repInc"></div></div>
</section>

<section class="page" id="p-more">
  <div class="menu">
    <button data-go="wal"><span>المحافظ والتحويلات</span>›</button>
    <button data-go="rec"><span>العمليات الثابتة (أقساط وغيرها)</span>›</button>
    <button data-go="debt"><span>الديون</span>›</button>
    <button data-go="set"><span>الإعدادات</span>›</button>
  </div>
</section>

<section class="page" id="p-debt"><div class="card" id="debts"></div></section>

<section class="page" id="p-wal">
  <div class="card"><h3>المحافظ والأرصدة</h3><div id="wallets"></div></div>
  <details class="card"><summary>محفظة جديدة</summary>
    <label>الاسم</label><input id="wname" placeholder="مثلا: فيزا البنك الأهلي">
    <label>النوع</label>
    <select id="wtype"><option>كاش</option><option>فيزا</option><option>ماستركارد</option><option>حساب بنكي</option><option>محفظة موبايل</option><option>معادن ثمينة</option><option>أخرى</option></select>
    <label>الرصيد الافتتاحي</label><input id="wopen" type="number" inputmode="decimal" value="0">
    <button id="addWallet">إضافة المحفظة</button>
  </details>
  <details class="card"><summary>تحويل بين محافظ</summary>
    <label>من</label><select id="tfrom"></select>
    <label>إلى</label><select id="tto"></select>
    <label>المبلغ</label><input id="tamount" type="number" inputmode="decimal">
    <div class="two">
      <div><label>التاريخ</label><input id="tdate" type="date"></div>
      <div><label>الوقت</label><input id="ttime" type="time"></div>
    </div>
    <label>السبب</label><input id="treason">
    <button id="addTransfer">تنفيذ التحويل</button>
  </details>
  <div class="card"><h3>سجل التحويلات</h3><div id="transfers"></div></div>
</section>

<section class="page" id="p-rec">
  <div id="dueBox2"></div>
  <div class="card"><h3>العمليات الثابتة</h3><div id="recs"></div></div>
  <details class="card"><summary>عملية ثابتة جديدة</summary>
    <label>الاسم</label><input id="rname" placeholder="مثلا: قسط الموبايل">
    <label>النوع</label><select id="rtype"><option value="expense">مصروف</option><option value="income">دخل</option></select>
    <label>المبلغ</label><input id="ramount" type="number" inputmode="decimal">
    <label>يوم الشهر (1 إلى 31)</label><input id="rday" type="number" inputmode="numeric" value="1">
    <label>المحفظة</label><select id="rwallet"></select>
    <label>التصنيف الرئيسي</label><select id="rcat"></select>
    <label>التصنيف الفرعي</label><select id="rsub"></select>
    <button id="addRec">إضافة</button>
  </details>
</section>

<section class="page" id="p-set">
  <div class="card">
    <label style="margin-top:0">رابط الـ API (من Apps Script)</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>المفتاح السري (APP_TOKEN)</label>
    <input id="token" type="password">
  </div>
  <div class="card">
    <label style="margin-top:0">تصنيفات المصروف: الرئيسي في سطر، وتحته الفرعية كل واحد في سطر يبدأ بعلامة - (شرطة)</label>
    <textarea id="catsExp" rows="10"></textarea>
    <label>تصنيفات الدخل بنفس الطريقة</label>
    <textarea id="catsInc" rows="8"></textarea>
    <button id="saveSet">حفظ الإعدادات</button>
    <button class="sec" id="reload">تحديث البيانات</button>
  </div>
</section>

</main>

<nav><div class="in">
  <button data-go="home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>
  <button data-go="list" data-nav="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>السجل</button>
  <button data-go="add" data-nav="add" class="fab"><span class="c"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>إضافة</button>
  <button data-go="report" data-nav="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</button>
  <button data-go="more" data-nav="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>المزيد</button>
</div></nav>

<script>
var TYPES={expense:'مصروف',income:'دخل',lent:'سلفت',borrowed:'استلفت',repay_in:'سداد ليا',repay_out:'سداد مني'};
var PLUS={income:1,borrowed:1,repay_in:1};
var DEF_EXP='أكل وشرب\n- مطاعم\n- بقالة\nمواصلات\n- أجرة\n- بنزين\nفواتير\nأقساط\nمشتريات\nصحة\nترفيه\nأخرى';
var DEF_INC='مرتب\nعمل حر\nهدايا\nأخرى';
var TITLES={home:'مصروفي',add:'إضافة عملية',list:'السجل',report:'التقارير',more:'المزيد',debt:'الديون',wal:'المحافظ والتحويلات',rec:'العمليات الثابتة',set:'الإعدادات'};
var SUB_OF_MORE={debt:1,wal:1,rec:1,set:1};
var EMPTY={Transactions:[],Wallets:[],Transfers:[],Recurring:[]};
var $=function(i){return document.getElementById(i)};
function parseCats(text){var t=[];String(text||'').split('\n').forEach(function(l){l=l.trim();if(!l)return;if(l.charAt(0)==='-'){var s=l.replace(/^-+\s*/,'');if(s&&t.length)t[t.length-1].subs.push(s)}else t.push({name:l,subs:[]})});return t}
var oldCats=localStorage.getItem('cats');
var S={url:localStorage.getItem('url')||'',token:localStorage.getItem('token')||'',
  catsExp:localStorage.getItem('catsExp')||oldCats||DEF_EXP,catsInc:localStorage.getItem('catsInc')||DEF_INC,
  data:JSON.parse(localStorage.getItem('data')||'null')||EMPTY};
S.tExp=parseCats(S.catsExp);S.tInc=parseCats(S.catsInc);
var A={kind:'expense',dt:'lent',main:'',sub:''};

function msg(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},2600)}
function p2(n){return ('0'+n).slice(-2)}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function nowTime(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())}
function num(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function isDebt(t){return t==='lent'||t==='borrowed'||t==='repay_in'||t==='repay_out'}
function wname(id){var w=S.data.Wallets.filter(function(x){return x.id===id})[0];return w?w.name:'؟'}
function curTree(){return A.kind==='income'?S.tInc:S.tExp}
function subsOf(tree,main){var c=tree.filter(function(x){return x.name===main})[0];return c?c.subs:[]}

function api(body){
  if(!S.url||!S.token){return Promise.reject('حط الرابط والمفتاح في الإعدادات')}
  body.token=S.token;
  return fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
   .then(function(r){return r.json()})
   .then(function(j){if(!j.ok)throw (j.error==='auth'?'المفتاح غلط':j.error);return j});
}
function load(){
  return api({action:'all'}).then(function(j){S.data=j.data;localStorage.setItem('data',JSON.stringify(S.data));render()}).catch(function(e){msg(String(e));render()});
}
function add(table,row){return api({action:'add',table:table,row:row})}
function readB64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=function(){rej('مش قادر أقرا الملف')};r.readAsDataURL(blob)})}
function prepFile(f){
  if(f.type==='application/pdf'){
    if(f.size>5*1024*1024)return Promise.reject('الـ PDF أكبر من 5 ميجا');
    return readB64(f).then(function(d){return {name:f.name,mime:f.type,data:d}});
  }
  if(!/^image\//.test(f.type))return Promise.reject('نوع الملف مش مدعوم');
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(f);
    img.onload=function(){
      var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){readB64(b).then(function(d){res({name:f.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',data:d})},rej)},'image/jpeg',0.7)};
    img.onerror=function(){rej('الصورة مش بتفتح')};img.src=u;
  });
}

function balances(){
  var b={};
  S.data.Wallets.forEach(function(w){b[w.id]=w.opening});
  S.data.Transactions.forEach(function(r){if(b[r.wallet]===undefined)return;b[r.wallet]+=(PLUS[r.type]?1:-1)*r.amount});
  S.data.Transfers.forEach(function(t){if(b[t.from]!==undefined)b[t.from]-=t.amount;if(b[t.to]!==undefined)b[t.to]+=t.amount});
  return b;
}
function foreign(w){return /\s-\s[A-Za-z]{3}$/.test(w.type||'')}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function dueItems(){
  var t=today(),m=t.slice(0,7),dd=parseInt(t.slice(8,10),10);
  return S.data.Recurring.filter(function(r){return r.active&&r.lastMonth<m&&r.day<=dd});
}
function dueDate(r){var t=today(),y=parseInt(t.slice(0,4),10),m=parseInt(t.slice(5,7),10);return y+'-'+p2(m)+'-'+p2(Math.min(r.day,lastDay(y,m)))}
function dueHtml(){
  var d=dueItems();if(!d.length)return '';
  return '<div class="card due"><h3>مستحق الشهر ده</h3>'+d.map(function(r){
    return '<div class="row"><div class="mid"><b>'+esc(r.name)+'</b><small>'+num(r.amount)+' - '+esc(wname(r.wallet))+'</small></div><button class="sm" data-ok="'+esc(r.id)+'">تأكيد</button><button class="sm sec" data-skip="'+esc(r.id)+'">تخطي</button></div>'}).join('')+'</div>';
}

function txRow(r,withDel){
  var inc=!!PLUS[r.type],debt=isDebt(r.type);
  var cls=debt?'db':inc?'in':'out',sym=debt?'د':inc?'↓':'↑';
  var title=debt?(TYPES[r.type]+' - '+(r.person||'')):(r.category||TYPES[r.type]);
  var sub=[r.subcategory,r.date+(r.time&&r.time!=='00:00'?' '+r.time:''),wname(r.wallet),r.note].filter(Boolean).join(' | ');
  return '<div class="row"><div class="ic '+cls+'">'+sym+'</div><div class="mid"><b>'+esc(title)+'</b><small>'+esc(sub)+(r.file?' <a href="https://drive.google.com/file/d/'+esc(r.file)+'/view" target="_blank">مرفق</a>':'')+'</small></div><div class="amt '+(inc?'in-c':'out-c')+'">'+(inc?'+':'-')+num(r.amount)+'</div>'+(withDel?'<button class="sm del" data-id="'+esc(r.id)+'">حذف</button>':'')+'</div>';
}
function bySort(a,b){return (a.date+a.time)<(b.date+b.time)?1:-1}

function monthStats(m){
  var inc=0,exp=0;
  S.data.Transactions.forEach(function(r){if(String(r.date).slice(0,7)!==m)return;if(r.type==='income')inc+=r.amount;if(r.type==='expense')exp+=r.amount});
  return {inc:inc,exp:exp};
}
function breakdown(kind,m){
  var by={},sb={},tot=0;
  S.data.Transactions.forEach(function(r){if(r.type!==kind||String(r.date).slice(0,7)!==m)return;
    var c=r.category||'بدون تصنيف';by[c]=(by[c]||0)+r.amount;tot+=r.amount;
    sb[c]=sb[c]||{};var n=r.subcategory||'بدون فرعي';sb[c][n]=(sb[c][n]||0)+r.amount});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!keys.length)return '<div class="empty">مفيش بيانات</div>';
  return keys.map(function(k){
    var pct=tot?Math.round(by[k]/tot*100):0;
    var subs=Object.keys(sb[k]).sort(function(a,b){return sb[k][b]-sb[k][a]});
    var h='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>'+esc(k)+'</b><b>'+num(by[k])+' <small style="color:var(--muted)">'+pct+'%</small></b></div><div class="bar '+(kind==='income'?'inb':'')+'"><i style="width:'+pct+'%"></i></div>';
    if(!(subs.length===1&&subs[0]==='بدون فرعي'))subs.forEach(function(n){h+='<div class="subrow"><span>'+esc(n)+'</span><span>'+num(sb[k][n])+'</span></div>'});
    return h+'</div>';
  }).join('');
}

function fillSelects(){
  var ws=S.data.Wallets.map(function(w){return '<option value="'+esc(w.id)+'">'+esc(w.name)+' ('+esc(w.type)+')</option>'}).join('');
  ['wallet','tfrom','tto','rwallet'].forEach(function(id){var v=$(id).value;$(id).innerHTML=ws;if(v)$(id).value=v});
  var lv=$('lwallet').value;$('lwallet').innerHTML='<option value="">كل المحافظ</option>'+ws;if(lv)$('lwallet').value=lv;
  fillRecCats();
}
function fillRecCats(){
  var tree=$('rtype').value==='income'?S.tInc:S.tExp,v=$('rcat').value;
  $('rcat').innerHTML='<option value="">بدون</option>'+tree.map(function(c){return '<option>'+esc(c.name)+'</option>'}).join('');
  if(v&&tree.some(function(c){return c.name===v}))$('rcat').value=v;
  fillRecSubs();
}
function fillRecSubs(){
  var tree=$('rtype').value==='income'?S.tInc:S.tExp,subs=subsOf(tree,$('rcat').value);
  $('rsub').innerHTML='<option value="">بدون</option>'+subs.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
}
function renderChips(){
  var tree=curTree();
  $('mainChips').innerHTML=tree.length?tree.map(function(c,i){return '<button class="chip'+(A.main===c.name?' on':'')+'" data-mi="'+i+'">'+esc(c.name)+'</button>'}).join(''):'<span class="empty">ضيف تصنيفات من الإعدادات</span>';
  var subs=subsOf(tree,A.main);
  $('subWrap').classList.toggle('hide',!subs.length);
  $('subChips').innerHTML=subs.map(function(s,i){return '<button class="chip'+(A.sub===s?' on':'')+'" data-si="'+i+'">'+esc(s)+'</button>'}).join('');
}
function setKind(k){
  A.kind=k;A.main='';A.sub='';
  document.querySelectorAll('#kindSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.kind===k)});
  $('debtBox').classList.toggle('hide',k!=='debt');
  $('catBox').classList.toggle('hide',k==='debt');
  renderChips();
}

function render(){
  fillSelects();
  var bal=balances(),m=today().slice(0,7);
  var total=0,fw=0;
  S.data.Wallets.forEach(function(w){if(foreign(w))fw++;else total+=bal[w.id]});
  $('total').textContent=num(total);
  $('totalNote').textContent=fw?'من غير '+fw+' محفظة بعملة أجنبية':'';
  var ms=monthStats(m);
  $('hin').textContent=num(ms.inc);$('hout').textContent=num(ms.exp);$('hnet').textContent=num(ms.inc-ms.exp);
  $('hwallets').innerHTML=S.data.Wallets.length?S.data.Wallets.map(function(w){
    return '<div class="wcard"><small>'+esc(w.type)+'</small><b class="'+(bal[w.id]<0?'out-c':'')+'">'+num(bal[w.id])+'</b><small>'+esc(w.name)+'</small></div>'}).join(''):'<div class="empty">ضيف محفظة من المزيد > المحافظ</div>';
  var rows=S.data.Transactions.slice().sort(bySort);
  $('hrecent').innerHTML=rows.length?rows.slice(0,6).map(function(r){return txRow(r,false)}).join(''):'<div class="empty">مفيش عمليات لسه</div>';
  $('dueBox').innerHTML=dueHtml();$('dueBox2').innerHTML=dueHtml();

  var lm=$('lmonth').value,lw=$('lwallet').value,all=$('lall').checked,q=$('lsearch').value.trim().toLowerCase();
  var fl=rows.filter(function(r){
    if(!all&&lm&&String(r.date).slice(0,7)!==lm)return false;
    if(lw&&r.wallet!==lw)return false;
    if(q&&[r.note,r.category,r.subcategory,r.person].join(' ').toLowerCase().indexOf(q)<0)return false;
    return true});
  $('list').innerHTML=fl.length?fl.slice(0,300).map(function(r){return txRow(r,true)}).join('')+(fl.length>300?'<div class="empty">بيظهر أول 300 عملية، ضيّق البحث</div>':''):'<div class="empty">مفيش عمليات</div>';

  var rm=$('month').value||m,st=monthStats(rm);
  $('rin').textContent=num(st.inc);$('rout').textContent=num(st.exp);$('rnet').textContent=num(st.inc-st.exp);
  $('repExp').innerHTML=breakdown('expense',rm);$('repInc').innerHTML=breakdown('income',rm);

  $('wallets').innerHTML=S.data.Wallets.length?S.data.Wallets.map(function(w){var v=bal[w.id];
    return '<div class="row"><div class="mid"><b>'+esc(w.name)+'</b><small>'+esc(w.type)+'</small></div><div class="amt '+(v<0?'out-c':'')+'">'+num(v)+'</div><button class="sm del" data-delw="'+esc(w.id)+'">حذف</button></div>'}).join(''):'<div class="empty">اضف محفظة الأول</div>';
  var tr=S.data.Transfers.slice().sort(bySort);
  $('transfers').innerHTML=tr.length?tr.slice(0,100).map(function(t){
    return '<div class="row"><div class="ic tr">⇄</div><div class="mid"><b>'+esc(wname(t.from))+' ← '+esc(wname(t.to))+'</b><small>'+esc(t.date)+' '+esc(t.time)+' | '+esc(t.reason)+'</small></div><div class="amt">'+num(t.amount)+'</div><button class="sm del" data-delt="'+esc(t.id)+'">حذف</button></div>'}).join(''):'<div class="empty">مفيش تحويلات</div>';
  $('recs').innerHTML=S.data.Recurring.length?S.data.Recurring.map(function(r){
    return '<div class="row"><div class="mid"><b>'+esc(r.name)+'</b><small>يوم '+r.day+' | '+esc(wname(r.wallet))+' | '+(r.active?'شغال':'موقوف')+'</small></div><div class="amt '+(r.type==='income'?'in-c':'out-c')+'">'+num(r.amount)+'</div><button class="sm sec" data-tog="'+esc(r.id)+'">'+(r.active?'وقف':'شغل')+'</button><button class="sm del" data-delr="'+esc(r.id)+'">حذف</button></div>'}).join(''):'<div class="empty">مفيش عمليات ثابتة</div>';

  var db={};
  S.data.Transactions.forEach(function(r){if(!isDebt(r.type))return;var k=r.person||'؟';db[k]=db[k]||{v:0,phone:r.phone,n:0};
    var s=(r.type==='lent'||r.type==='repay_out')?1:-1;db[k].v+=s*r.amount;db[k].n++;if(r.phone)db[k].phone=r.phone});
  var names=Object.keys(db).filter(function(k){return Math.abs(db[k].v)>=0.005}).sort(function(a,b){return Math.abs(db[b].v)-Math.abs(db[a].v)});
  $('debts').innerHTML=names.length?names.map(function(k){var v=db[k].v;
    return '<div class="row"><div class="ic db">د</div><div class="mid"><b>'+esc(k)+'</b><small>'+esc(db[k].phone)+' '+db[k].n+' عملية</small></div><div class="amt '+(v>0?'in-c':'out-c')+'">'+(v>0?'عليه ':'ليه ')+num(Math.abs(v))+'</div></div>'}).join(''):'<div class="empty">مفيش ديون</div>';
}

function go(p){
  document.querySelectorAll('.page').forEach(function(s){s.classList.toggle('on',s.id==='p-'+p)});
  var navKey=SUB_OF_MORE[p]?'more':p;
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.nav===navKey)});
  $('title').textContent=TITLES[p]||'مصروفي';
  $('backBtn').classList.toggle('hide',!SUB_OF_MORE[p]);
  window.scrollTo(0,0);render();
}

$('date').value=today();$('time').value=nowTime();$('tdate').value=today();$('ttime').value=nowTime();
$('month').value=today().slice(0,7);$('lmonth').value=today().slice(0,7);
$('url').value=S.url;$('token').value=S.token;$('catsExp').value=S.catsExp;$('catsInc').value=S.catsInc;
['month','lmonth','lwallet','lall','lsearch'].forEach(function(id){$(id).oninput=render;$(id).onchange=render});
$('rtype').onchange=fillRecCats;$('rcat').onchange=fillRecSubs;

$('pick').onclick=function(){
  if(!('contacts' in navigator&&'ContactsManager' in window)){msg('المتصفح مش بيدعم جهات الاتصال. افتح من Chrome');return}
  navigator.contacts.select(['name','tel'],{multiple:false}).then(function(c){
    if(c&&c[0]){$('person').value=(c[0].name&&c[0].name[0])||'';$('phone').value=(c[0].tel&&c[0].tel[0])||''}
  }).catch(function(e){msg('اتلغى: '+e)});
};
$('save').onclick=function(){
  var debt=A.kind==='debt',t=debt?A.dt:A.kind,a=parseFloat($('amount').value);
  if(!$('wallet').value){msg('اضف محفظة الأول');return}
  if(!(a>0)){msg('اكتب المبلغ');return}
  if(debt&&!$('person').value){msg('اختار الشخص');return}
  if(!debt&&curTree().length&&!A.main){msg('اختار التصنيف');return}
  var row={date:$('date').value,time:$('time').value,type:t,amount:a,wallet:$('wallet').value,category:debt?'':A.main,subcategory:debt?'':A.sub,note:$('note').value,person:debt?$('person').value:'',phone:debt?$('phone').value:''};
  $('save').disabled=true;
  var fl=$('file').files[0];
  (fl?prepFile(fl).then(function(o){msg('برفع الملف...');o.action='upload';return api(o)}).then(function(j){row.file=j.fileId}):Promise.resolve())
   .then(function(){return add('Transactions',row)}).then(function(){$('amount').value='';$('note').value='';$('file').value='';$('time').value=nowTime();A.main='';A.sub='';renderChips();msg('اتحفظ ✓');return load()})
   .catch(function(e){msg(String(e))}).then(function(){$('save').disabled=false});
};
function done(p,ok){return p.then(function(){if(ok)msg(ok);return load()}).catch(function(e){msg(String(e))})}
$('addWallet').onclick=function(){
  var n=$('wname').value.trim();if(!n){msg('اكتب اسم المحفظة');return}
  done(add('Wallets',{name:n,type:$('wtype').value,opening:parseFloat($('wopen').value)||0}),'اتضافت ✓').then(function(){$('wname').value=''});
};
$('addTransfer').onclick=function(){
  var a=parseFloat($('tamount').value),f=$('tfrom').value,t=$('tto').value;
  if(!f||!t||f===t){msg('اختار محفظتين مختلفتين');return}
  if(!(a>0)){msg('اكتب المبلغ');return}
  if(!$('treason').value.trim()){msg('اكتب السبب');return}
  done(add('Transfers',{date:$('tdate').value,time:$('ttime').value,from:f,to:t,amount:a,reason:$('treason').value.trim()}),'اتحول ✓').then(function(){$('tamount').value='';$('treason').value='';$('ttime').value=nowTime()});
};
$('addRec').onclick=function(){
  var a=parseFloat($('ramount').value),d=parseInt($('rday').value,10),n=$('rname').value.trim();
  if(!n||!(a>0)||!(d>=1&&d<=31)||!$('rwallet').value){msg('كمل البيانات');return}
  done(add('Recurring',{name:n,type:$('rtype').value,amount:a,category:$('rcat').value,subcategory:$('rsub').value,wallet:$('rwallet').value,day:d,active:true,lastMonth:'',note:''}),'اتضافت ✓').then(function(){$('rname').value='';$('ramount').value=''});
};
function byId(list,id){return list.filter(function(x){return x.id===id})[0]}
document.body.onclick=function(e){
  var el=e.target.closest?e.target.closest('button,a'):e.target;if(!el)return;
  var ds=el.dataset||{};
  if(ds.go){go(ds.go);return}
  if(ds.kind){setKind(ds.kind);return}
  if(ds.dt){A.dt=ds.dt;document.querySelectorAll('#debtChips .chip').forEach(function(b){b.classList.toggle('on',b.dataset.dt===ds.dt)});return}
  if(ds.mi!==undefined){var c=curTree()[+ds.mi];A.main=(A.main===c.name?'':c.name);A.sub='';renderChips();return}
  if(ds.si!==undefined){var s=subsOf(curTree(),A.main)[+ds.si];A.sub=(A.sub===s?'':s);renderChips();return}
  if(ds.id){if(confirm('تحذف؟'))done(api({action:'delete',table:'Transactions',id:ds.id}))}
  else if(ds.delt){if(confirm('تحذف التحويل؟'))done(api({action:'delete',table:'Transfers',id:ds.delt}))}
  else if(ds.delr){if(confirm('تحذف العملية الثابتة؟'))done(api({action:'delete',table:'Recurring',id:ds.delr}))}
  else if(ds.delw){
    var used=S.data.Transactions.some(function(r){return r.wallet===ds.delw})||S.data.Transfers.some(function(t){return t.from===ds.delw||t.to===ds.delw})||S.data.Recurring.some(function(r){return r.wallet===ds.delw});
    if(used){msg('المحفظة عليها عمليات، مينفعش تتحذف');return}
    if(confirm('تحذف المحفظة؟'))done(api({action:'delete',table:'Wallets',id:ds.delw}));
  }
  else if(ds.tog){var r=byId(S.data.Recurring,ds.tog);done(api({action:'set',table:'Recurring',id:ds.tog,fields:{active:!r.active}}))}
  else if(ds.skip){done(api({action:'set',table:'Recurring',id:ds.skip,fields:{lastMonth:today().slice(0,7)}}))}
  else if(ds.ok){
    var r2=byId(S.data.Recurring,ds.ok);
    add('Transactions',{date:dueDate(r2),time:'00:00',type:r2.type,amount:r2.amount,wallet:r2.wallet,category:r2.category,subcategory:r2.subcategory||'',note:r2.name+' (ثابتة)',person:'',phone:''})
     .then(function(){return api({action:'set',table:'Recurring',id:r2.id,fields:{lastMonth:today().slice(0,7)}})})
     .then(function(){msg('اتسجلت ✓');return load()}).catch(function(x){msg(String(x));load()});
  }
};
$('saveSet').onclick=function(){
  S.url=$('url').value.trim();S.token=$('token').value.trim();
  S.catsExp=$('catsExp').value;S.catsInc=$('catsInc').value;S.tExp=parseCats(S.catsExp);S.tInc=parseCats(S.catsInc);
  localStorage.setItem('url',S.url);localStorage.setItem('token',S.token);localStorage.setItem('catsExp',S.catsExp);localStorage.setItem('catsInc',S.catsInc);
  A.main='';A.sub='';renderChips();msg('اتحفظت');load()};
$('reload').onclick=load;
setKind('expense');
go('home');if(S.url&&S.token)load();
</script>
</body>
</html>
